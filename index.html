<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PWS Demo</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="system-group left">
          <span class="brand">PWS</span>
          <span class="desk-name">Polymorphic Workspace</span>
        </div>

        <div class="system-group center">
          <span class="status-pill">auto-layout</span>
          <span class="status-pill accent">quickshell</span>
        </div>

        <div class="system-group right">
          <span class="glyph">◔</span>
          <span class="glyph">⚙</span>
          <span class="glyph">⏻</span>
        </div>
      </header>

      <div class="desktop">
        <aside class="dock" aria-label="Application dock">
          <button class="dock-app active">⌂</button>
          <button class="dock-app">◫</button>
          <button class="dock-app">◧</button>
          <button class="dock-app">✦</button>
          <button class="dock-app">◌</button>
        </aside>

        <main class="workspace-panel">
          <div class="workspace-header">
            <div>
              <p class="eyebrow">active desktop</p>
              <h1>Workspace 01</h1>
            </div>
            <div class="workspace-actions">
              <button>tile</button>
              <button class="primary">focus</button>
            </div>
          </div>

          <div id="workspace" class="workspace" aria-live="polite"></div>
        </main>
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
